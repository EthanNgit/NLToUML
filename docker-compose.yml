services:
  backend:
    build: ./backend
    environment:
      - OPENAI_ENABLED=${OPENAI_ENABLED}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_ENDPOINT=${OPENAI_ENDPOINT}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME}
      - OPENAI_PROMPT_FILE=${OPENAI_PROMPT_FILE}

      - DEEPSEEK_ENABLED=${DEEPSEEK_ENABLED}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
      - DEEPSEEK_ENDPOINT=${DEEPSEEK_ENDPOINT}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL_NAME=${DEEPSEEK_MODEL_NAME}
      - DEEPSEEK_PROMPT_FILE=${DEEPSEEK_PROMPT_FILE}

      - GEMINI_ENABLED=${GEMINI_ENABLED}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL}
      - GEMINI_ENDPOINT=${GEMINI_ENDPOINT}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL_NAME=${GEMINI_MODEL_NAME}
      - GEMINI_PROMPT_FILE=${GEMINI_PROMPT_FILE}

      - LOCAL_ENABLED=${LOCAL_ENABLED}
      - LOCAL_BASE_URL=${LOCAL_BASE_URL}
      - LOCAL_ENDPOINT=${LOCAL_ENDPOINT}
      - LOCAL_API_KEY=${LOCAL_API_KEY}
      - LOCAL_MODEL_NAME=${LOCAL_MODEL_NAME}
      - LOCAL_PROMPT_FILE=${LOCAL_PROMPT_FILE}

      - LLMCONF_PATH=/config/llmconf.yml
      - PROMPTS_PATH=/etc/llm-prompts
    volumes:
      - ./llmconf.yml:/config/llmconf.yml
      - ./prompts:/etc/llm-prompts
    ports:
      - "8080:8080"
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
